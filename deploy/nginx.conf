# Nginx configuration for vkorn.at
# Place at: /etc/nginx/sites-available/vkorn.at
# Enable with: ln -s /etc/nginx/sites-available/vkorn.at /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name vkorn.at www.vkorn.at;

    # Redirect all HTTP to HTTPS
    return 301 https://vkorn.at$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vkorn.at www.vkorn.at;

    # Let's Encrypt certificates (filled in by Certbot)
    ssl_certificate     /etc/letsencrypt/live/vkorn.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkorn.at/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www → non-www
    if ($host = www.vkorn.at) {
        return 301 https://vkorn.at$request_uri;
    }

    root /var/www/vkorn/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/html
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache control for assets (hashed filenames from Astro build)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache images
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # HTML — no cache so updates appear immediately
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: serve index.html for any path that doesn't match a file
    location / {
        try_files $uri $uri/ $uri.html /404.html =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
