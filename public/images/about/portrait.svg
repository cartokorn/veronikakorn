<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg-p" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#C8B8A0"/>
      <stop offset="100%" stop-color="#A89880"/>
    </linearGradient>
  </defs>
  <!-- Background - warm atelier atmosphere -->
  <rect width="400" height="500" fill="url(#bg-p)"/>
  <!-- Wall suggestion -->
  <rect x="0" y="0" width="280" height="500" fill="#B8A888" opacity="0.6"/>
  <!-- Canvas/artwork in background -->
  <rect x="20" y="40" width="140" height="180" fill="#D4C8A8" opacity="0.5"/>
  <rect x="30" y="50" width="120" height="160" fill="#C0A870" opacity="0.5"/>
  <!-- Body/silhouette -->
  <ellipse cx="180" cy="440" rx="110" ry="120" fill="#7A6050"/>
  <rect x="90" y="350" width="180" height="150" fill="#7A6050"/>
  <!-- Top/clothing -->
  <ellipse cx="180" cy="380" rx="85" ry="70" fill="#4A3828"/>
  <!-- Neck -->
  <rect x="163" y="295" width="34" height="60" fill="#C4A888"/>
  <!-- Head -->
  <ellipse cx="180" cy="270" rx="68" ry="80" fill="#C4A888"/>
  <!-- Hair - dark -->
  <ellipse cx="180" cy="210" rx="68" ry="55" fill="#2A1C10"/>
  <ellipse cx="130" cy="250" rx="28" ry="60" fill="#2A1C10"/>
  <ellipse cx="230" cy="248" rx="26" ry="58" fill="#2A1C10"/>
  <!-- Face features - soft suggestion -->
  <ellipse cx="158" cy="262" rx="11" ry="8" fill="#3A2818" opacity="0.7"/>
  <ellipse cx="202" cy="262" rx="11" ry="8" fill="#3A2818" opacity="0.7"/>
  <ellipse cx="180" cy="285" rx="10" ry="6" fill="#B08870" opacity="0.5"/>
  <!-- Subtle smile -->
  <path d="M 165 300 Q 180 310 195 300" stroke="#A07860" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Paint palette in hand suggestion -->
  <ellipse cx="95" cy="400" rx="32" ry="22" fill="#D4B070" opacity="0.6"/>
  <ellipse cx="82" cy="395" rx="10" ry="8" fill="#C04020" opacity="0.7"/>
  <ellipse cx="98" cy="392" rx="9" ry="7" fill="#2050A0" opacity="0.6"/>
  <ellipse cx="112" cy="396" rx="9" ry="7" fill="#30A030" opacity="0.6"/>
  <!-- Soft light from left -->
  <rect x="0" y="0" width="100" height="500" fill="#F0E8D0" opacity="0.12"/>
</svg>
